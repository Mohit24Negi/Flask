<!DOCTYPE html>
<html lang="en">
<head>
  <title>Hello World</title>
</head>
<body>
    {% if is_logged_in%}
    <h2>Welcome back</h2>
    {% else %}
    <h2>Please Login</h2>
    {% endif %}

    {% if marks>= 90 %}
    <h2>Grade A</h2>
    {% elif marks>= 75 %}
    <h2>Grade B</h2>
    {% elif marks>= 50 %}
    <h2>Grade C</h2>
    {% else %}
    <h2> Fail </h2>
    {% endif%}
</body>
</html>
